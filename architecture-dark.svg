<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="Three Ubuntu instances join the same Samba mini-AD three different ways: linux-sssd-ad with SSSD's AD provider and Kerberos, linux-winbind with winbind and Kerberos, and linux-sssd-ldap with SSSD's LDAP provider over LDAPS and no join at all, trusting the DC's CA fetched from /ca.pem. Each serves a shellinabox login on port 80. A Windows Server 2022 host joins the domain for ADUC. All four read the AD admin password from Secrets Manager. The DC sits in a private subnet behind a NAT gateway."><defs><marker id="a_e_rdp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_pw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_h3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_j1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_j2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_j3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_jw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_nat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8d6e8"/></marker></defs><rect width="1620" height="790" fill="#0d1117"/><path d="M600,95.0 H465" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_rdp)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">RDP :3389</text><path d="M1160,95.0 H1025" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_pw)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">password</text><path d="M750.0,150 V195.0 H250.0 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_h1)"/><path d="M810.0,150 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_h2)"/><text x="824.0" y="217.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">HTTP :80 (shellinabox)</text><path d="M870.0,150 V195.0 H1370.0 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_h3)"/><path d="M250.0,350 V495.0 H595" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_j1)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">Kerberos</text><path d="M810.0,350 V435" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_j2)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">Kerberos</text><path d="M1370.0,350 V495.0 H1025" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_j3)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">LDAPS :636</text><path d="M40,95.0 H20 V595.0 H750.0 V555" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_jw)"/><text x="470.0" y="587.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">domain member</text><path d="M810.0,550 V635" fill="none" stroke="#c8d6e8" stroke-width="2" marker-end="url(#a_e_nat)"/><text x="824.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c8d6e8" stroke="#0d1117" stroke-width="6" paint-order="stroke">outbound</text><rect x="40" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><g transform="translate(60,80.0) scale(1.25)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></g><text x="104.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size